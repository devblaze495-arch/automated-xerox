services:
  # ========================================================
  # 1. PostgreSQL 16 Database
  # ========================================================
  postgres:
    image: postgres:16-alpine
    container_name: campus-print-postgres-prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password required}
      POSTGRES_DB: ${POSTGRES_DB:-campus_print_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-postgres-dbs.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # ========================================================
  # 2. Redis 7 (Cache & BullMQ Job Queue)
  # ========================================================
  redis:
    image: redis:7-alpine
    container_name: campus-print-redis-prod
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Redis password required}"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # ========================================================
  # 3. Self-Hosted UPI Gateway (Laravel 12 / PHP 8.3)
  # ========================================================
  upi-gateway:
    build:
      context: ${UPI_GATEWAY_PATH:-../upi-gateway}
      dockerfile: Dockerfile
    container_name: campus-print-upi-gateway-prod
    restart: always
    environment:
      APP_NAME: "CampusPrint UPI Gateway"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${UPI_GATEWAY_APP_KEY:?Laravel application key required}
      APP_URL: "https://upi.${DOMAIN}"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: upi_gateway_db
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      GATEWAY_WEBHOOK_ALLOW_INSECURE: ${GATEWAY_WEBHOOK_ALLOW_INSECURE:-false}
      GATEWAY_ALLOW_INSECURE_REDIRECTS: ${GATEWAY_ALLOW_INSECURE_REDIRECTS:-false}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
      - web_traffic

  # ========================================================
  # 4. Fastify Node.js Backend & WebSocket Gateway
  # ========================================================
  backend:
    build:
      context: ./packages/backend
      dockerfile: Dockerfile
    container_name: campus-print-backend-prod
    restart: always
    environment:
      NODE_ENV: production
      PORT: 4000
      HOST: 0.0.0.0
      PUBLIC_BASE_URL: "https://api.${DOMAIN}"
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-campus_print_db}?schema=public"
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379"
      AGENT_SECRET: ${AGENT_SECRET:?Agent secret key required}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-campus-print-documents}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      UPI_GATEWAY_URL: "http://upi-gateway:8000"
      UPI_GATEWAY_API_KEY: ${UPI_GATEWAY_API_KEY:?UPI gateway API key required}
      UPI_GATEWAY_API_SECRET: ${UPI_GATEWAY_API_SECRET:?UPI gateway secret required}
      UPI_GATEWAY_WEBHOOK_SECRET: ${UPI_GATEWAY_WEBHOOK_SECRET:?UPI gateway webhook secret required}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
    volumes:
      - backend_uploads:/app/uploads
    # Run Prisma migration/db push on container boot before launching server
    command: >
      sh -c "npx prisma db push --accept-data-loss && node dist/server.js"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      upi-gateway:
        condition: service_started
    networks:
      - internal
      - web_traffic

  # ========================================================
  # 5. Next.js 14+ Web Application (Operator & Shop SaaS)
  # ========================================================
  web:
    build:
      context: ./packages/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: "https://api.${DOMAIN}"
    container_name: campus-print-web-prod
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: "0.0.0.0"
      NEXT_PUBLIC_API_URL: "https://api.${DOMAIN}"
    depends_on:
      - backend
    networks:
      - web_traffic

  # ========================================================
  # 6. Caddy Reverse Proxy & Automatic Let's Encrypt SSL
  # ========================================================
  caddy:
    image: caddy:2-alpine
    container_name: campus-print-caddy-prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3 QUIC
    environment:
      DOMAIN: ${DOMAIN:?Domain required for SSL routing}
      ACME_EMAIL: ${ACME_EMAIL:-admin@${DOMAIN}}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - web
      - upi-gateway
    networks:
      - web_traffic

# ==========================================================
# Volumes & Networks
# ==========================================================
volumes:
  pgdata:
    name: campus_print_pgdata
  redisdata:
    name: campus_print_redisdata
  backend_uploads:
    name: campus_print_backend_uploads
  caddy_data:
    name: campus_print_caddy_data
  caddy_config:
    name: campus_print_caddy_config

networks:
  internal:
    driver: bridge
  web_traffic:
    driver: bridge

